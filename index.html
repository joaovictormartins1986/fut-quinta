<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fut Quinta</title>
<meta name="theme-color" content="#0b1310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fut Quinta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1310;--s1:#121d18;--s2:#1a2822;--s3:#24362e;--line:#2b3f36;
  --tx:#e9f2ed;--mu:#8fa69b;--ac:#3ddc97;--ac2:#1f8f5f;--warn:#f5b041;--bad:#ef5350;
  --p1:#3ddc97;--p2:#7bd3f7;--p3:#c7b8ff;--p4:#f5b041;--p5:#ef8a6a;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:84px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.num,.cond{font-family:"Barlow Condensed",Inter,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(11,19,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-family:"Barlow Condensed";font-weight:800;font-size:24px;letter-spacing:.5px;text-transform:uppercase}
header h1 b{color:var(--ac)}
header .date{margin-left:auto;display:flex;align-items:center;gap:6px}
header .date input{width:auto;padding:6px 8px;font-size:14px}
.sync{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mu);display:inline-block}
.sync.ok i{background:var(--ac)}.sync.loc i{background:var(--warn)}.sync.err i{background:var(--bad)}
main{max-width:980px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--s1);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:150px;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu);font-size:11px;font-weight:600}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ac)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h2{font-family:"Barlow Condensed";font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{margin-left:auto}
.mu{color:var(--mu)}.sm{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;background:var(--s3);font-weight:600;font-size:14px;border:1px solid var(--line)}
.btn.pri{background:var(--ac);color:#06281a;border-color:var(--ac)}
.btn.bad{background:transparent;color:var(--bad);border-color:#5a2a2a}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.blk{width:100%}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--s2);border-radius:10px;padding:10px 12px}
.stat .l{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-family:"Barlow Condensed";font-size:26px;font-weight:700;line-height:1.1}
.pos{color:var(--ac)}.neg{color:var(--bad)}
.potbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.potbar span{font-size:12.5px;padding:4px 9px;border-radius:20px;background:var(--s2);border:1px solid var(--line)}
.potbar span.w{border-color:var(--warn);color:var(--warn)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--s2);min-height:46px}
.prow.off{background:transparent;border:1px dashed var(--line)}
.prow.off .nm{opacity:.6}
.prow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{width:32px;height:32px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-weight:800}
.prow:not(.off) .chk{background:var(--ac);border-color:var(--ac);color:#06281a}
.pots{display:flex;gap:3px;flex:none}
.pot{width:27px;height:30px;border-radius:7px;background:var(--s3);color:var(--mu);font-family:"Barlow Condensed";font-weight:700;font-size:16px}
.pot.sel{color:#08140f}
.pot.sel.p1{background:var(--p1)}.pot.sel.p2{background:var(--p2)}.pot.sel.p3{background:var(--p3)}.pot.sel.p4{background:var(--p4)}.pot.sel.p5{background:var(--p5)}
.pay{flex:none;min-width:58px;padding:7px 8px;border-radius:8px;font-size:12.5px;font-weight:700;border:1px solid var(--warn);color:var(--warn)}
.pay.ok{background:var(--ac2);border-color:var(--ac2);color:#dfffee}
.pay.ok.bal{background:#6b4a12;border-color:#6b4a12;color:#ffe2a8}
.pays{display:flex;gap:4px;flex:none}
.fech{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14.5px;align-items:center}
.fech .v{font-family:"Barlow Condensed";font-size:21px;font-weight:700;text-align:right}
.fech .big{font-size:30px;color:var(--ac)}
.fech hr{grid-column:1/-1;border:0;border-top:1px solid var(--line)}
.pb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-family:"Barlow Condensed";font-weight:700;font-size:13px;color:#08140f;flex:none}
.pb.p1{background:var(--p1)}.pb.p2{background:var(--p2)}.pb.p3{background:var(--p3)}.pb.p4{background:var(--p4)}.pb.p5{background:var(--p5)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.team{border-radius:12px;overflow:hidden;background:var(--s2);border:1px solid var(--line)}
.team .th{padding:8px 10px;display:flex;align-items:center;gap:8px;font-family:"Barlow Condensed";font-weight:800;font-size:19px;text-transform:uppercase}
.team .th small{margin-left:auto;font-family:Inter;font-size:11.5px;font-weight:600;opacity:.85;text-transform:none}
.team ul{list-style:none;padding:6px}
.team li button{width:100%;display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;text-align:left}
.team li button.sel{background:var(--s3);outline:2px solid var(--ac)}
.sect{font-family:"Barlow Condensed";font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);grid-column:1/-1}
.sect .mu{font-family:Inter;font-size:12px;text-transform:none;letter-spacing:0;font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:9px;border-radius:8px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--ac);color:#06281a}
.potsro{display:flex;gap:3px;margin-left:auto;flex:none}
.potsro span{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:700;font-size:13px}
.potsro .po{color:var(--mu);opacity:.35;background:var(--s3)}
.potsect{display:flex;align-items:center;gap:8px}
.wtxt{color:var(--warn)!important}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--mu);font-weight:700;padding:2px 0}
.cal .wd.t{color:var(--ac)}
.cal button{position:relative;padding:8px 0;border-radius:8px;font-size:14px;color:var(--mu)}
.cal button.ter{color:var(--tx);font-weight:700;background:var(--s2);border:1px solid var(--ac2)}
.cal button.sel{background:var(--ac);color:#06281a;border-color:var(--ac)}
.cal button.hoje{text-decoration:underline}
.cal button .dt{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--ac)}
.cal button.sel .dt{background:#06281a}
.cal button .dt.pend{background:var(--warn)}
.calh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calh b{flex:1;text-align:center;font-family:"Barlow Condensed";font-size:18px;text-transform:capitalize}
.prow[hidden],.sect[hidden],.plist[hidden]{display:none!important}
.filtro{position:sticky;top:58px;z-index:5;background:var(--s1);padding:4px 0 8px}
.filtro input{font-size:16px}
.mtag{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:#2b3c6b;color:#b9cbff;font-size:11px;font-weight:800;vertical-align:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:20px;background:var(--s3);font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip.sel{outline:2px solid var(--ac)}
/* jogo */
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.side{border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.side .tn{font-family:"Barlow Condensed";font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.5px}
.side .gl{font-family:"Barlow Condensed";font-weight:800;font-size:84px;line-height:.9}
.side .gb{display:flex;gap:8px}
.side .gb button{width:52px;height:44px;border-radius:12px;background:rgba(0,0,0,.25);font-size:24px;font-weight:800}
.side .gb button.plus{width:72px;background:rgba(0,0,0,.4)}
.side .roster{width:100%;display:flex;flex-direction:column;gap:4px;margin-top:4px}
.slot{width:100%;display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:9px;background:rgba(0,0,0,.14);text-align:left;font-weight:600;font-size:14px;min-height:38px;color:inherit}
.slot .pb{box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.slot.vaga{background:transparent;border:2px dashed currentColor;opacity:.85;font-weight:700}
.slot.sub{background:rgba(255,255,255,.28)}
.slot small{font-weight:500;opacity:.75;font-size:11.5px;display:block}
.slot.aus{opacity:.55;text-decoration:line-through}
.qlist{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.qlist .slot{background:var(--s3);color:var(--tx)}
.qlist .slot.aus{background:transparent;border:1px dashed var(--line)}
.slotw{display:flex;gap:4px;align-items:stretch;width:100%}
.slotw .slot{flex:1;min-width:0}
.sx{flex:none;width:34px;border-radius:9px;background:rgba(0,0,0,.22);color:inherit;font-weight:800;font-size:15px;display:grid;place-items:center;border:0;cursor:pointer}
.cand{display:flex;flex-direction:column;gap:6px}
.cand button{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--s2);text-align:left;font-weight:600}
.evb{font-size:12px;margin-left:2px}
.abox{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border:1.5px solid currentColor;border-radius:3px;font-family:Inter,sans-serif;font-weight:800;font-size:.8em;line-height:1;vertical-align:-.12em;margin-right:2px}
.evlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hist div{flex-wrap:wrap}
.cand button small{margin-left:auto;color:var(--mu);font-weight:500}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:150px}
.clock{font-family:"Barlow Condensed";font-weight:800;font-size:76px;line-height:1;letter-spacing:1px;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--warn)}.clock.end{color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.ctrl{display:flex;gap:8px}
.ctrl .btn{padding:12px 16px;font-size:16px}
.result{display:contents}
.resdone{grid-column:1/-1;border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.resdone .rt{font-family:"Barlow Condensed";font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.5px}
.resdone .rt .num{margin-left:8px;opacity:.75}
.resdone .btn{background:rgba(0,0,0,.25);border:0;color:inherit}
.resdone .btn.pri{background:#0b1310;color:var(--ac);padding:12px 16px}
.result .btn{width:100%}
.result .btn{padding:14px 8px;font-size:15px}
.result .btn.sug{outline:3px solid #fff;outline-offset:2px}
.queue{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard{border-radius:12px;padding:10px 12px;background:var(--s2);border-left:8px solid}
.qcard .ql{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.qcard .qn{font-family:"Barlow Condensed";font-size:22px;font-weight:800;text-transform:uppercase}
.qcard .qp{font-size:12.5px;color:var(--mu)}
.hist{display:flex;flex-direction:column;gap:4px}
.hist div{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--s2);border-radius:8px;font-size:14px}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.flash{position:fixed;inset:0;background:var(--bad);opacity:0;pointer-events:none;z-index:50}
.flash.go{animation:fl 2.4s ease-out}
@keyframes fl{0%,20%,40%{opacity:.55}10%,30%{opacity:0}100%{opacity:0}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
.debt{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.debt .top{display:flex;align-items:center;gap:8px;font-weight:600}
.debt .top .v{margin-left:auto;color:var(--warn);font-family:"Barlow Condensed";font-size:20px}
.debt .days{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mu)}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}
.banner{background:#3a2c10;border:1px solid #6b5016;color:#ffd99a;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
#modal{position:fixed;inset:0;z-index:60;display:none}
#modal.open{display:block}
.mbg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92vw);max-height:86vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.mbox h3{font-family:"Barlow Condensed";font-size:22px;text-transform:uppercase}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-weight:600;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--mu)}
@media (min-width:760px){
  .side .gb button{width:64px;height:56px;font-size:28px}
  .side .gb button.plus{width:96px}
  .ctrl .btn{padding:14px 22px;font-size:18px}
  .result .btn{padding:18px 8px;font-size:17px}
  .slot{min-height:44px;font-size:15px}
  .clock{font-size:clamp(76px,11vw,120px)}
  .side .gl{font-size:clamp(84px,10vw,120px)}
  .side .tn{font-size:28px}
}
@media (min-width:1000px) and (orientation:landscape){
  main.wide{max-width:1500px}
  .jgrid{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(300px,1fr);gap:14px;align-items:start}
  .jside .queue{grid-template-columns:1fr}
  .jside .card h2{flex-wrap:wrap}
  .jside .qlist .slot{min-height:36px;padding:5px 8px}
  .jside .qcard .qn{font-size:20px}
  .clock{font-size:clamp(90px,9vw,150px)}
  .mid{min-width:200px}
}
@media (min-width:1000px) and (orientation:landscape) and (max-height:900px){
  .jmain .card{padding:12px}
  .jmain .card h2{margin-bottom:6px}
  .side{padding:10px;gap:4px}
  .side .gl{font-size:96px}
  .side .tn{font-size:26px}
  .side .roster .slot{min-height:38px;padding:5px 8px}
  .result .btn{padding:15px 8px}
  .rulehint{display:none}
}
@media (min-width:1100px){ .plist{display:grid;grid-template-columns:1fr 1fr} }
@media (max-width:620px){
  .board{grid-template-columns:1fr 1fr}
  .mid{grid-column:1/-1;order:-1;flex-direction:row;flex-wrap:wrap}
  .result .btn[data-r="e"]{grid-column:1/-1;order:1}
  .clock{font-size:84px;width:100%;text-align:center}
  .side .gl{font-size:72px}
  header h1{font-size:20px}
  .sync span{display:none}
  .prow{flex-wrap:wrap;row-gap:6px}
  .prow .nm{flex:1 1 calc(100% - 44px)}
  .prow .pots{margin-left:0}
  .prow .pay{min-width:52px;padding:7px 6px}
  .prow .pays{margin-left:auto}
  .prow.inl{flex-wrap:nowrap}
  .prow.inl .nm{flex:1 1 auto}
}
/* celular deitado: tudo do jogo cabe numa tela */
@media (orientation:landscape) and (max-height:520px){
  header{padding:5px 12px} header h1{font-size:18px} header .date input{padding:3px 6px;font-size:13px}
  body{padding-bottom:44px}
  nav button{flex-direction:row;justify-content:center;gap:6px;padding:7px 4px;font-size:12px}
  nav button svg{width:18px;height:18px}
  main{padding:8px}
  .card{padding:10px;margin-bottom:10px}
  .jmain .card>h2{display:none}
  .side{padding:6px 8px;gap:3px;border-radius:12px}
  .side .tn{font-size:19px}
  .side .tn + .sm{display:none}
  .side .gl{font-size:54px}
  .side .gb button{width:44px;height:38px;font-size:22px}
  .side .gb button.plus{width:64px}
  .side .roster{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:2px}
  .side .roster .slot{width:auto;min-height:0;padding:3px 6px;font-size:12px;gap:4px}
  .side .roster .slot small{display:inline;margin-left:3px}
  .side .roster .slot .pb{width:15px;height:15px;font-size:10px}
  .side .roster .slotw{width:auto}
  .side .roster .sx{width:24px;font-size:12px;border-radius:7px}
  .mid{min-width:130px;gap:6px}
  .clock{font-size:66px}
  .ctrl .btn{padding:8px 12px;font-size:14px}
  .result .btn{padding:10px 6px;font-size:14px}
  .rulehint{display:none}
}
</style>
</head>
<body>
<header>
  <h1>Fut <b>Quinta</b></h1>
  <div class="sync" id="sync"><i></i><span>conectando…</span></div>
  <div class="date"><input type="date" id="dateIn" aria-label="Data do jogo"></div>
</header>
<main id="view"><div class="loading">Carregando…</div></main>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>
<div class="flash" id="flash"></div>

<script>
/* ================= base ================= */
const $ = s => document.querySelector(s);
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const matchNm = (nome, q) => { q = norm(q); if (!q) return true; const n = norm(nome); return n.startsWith(q) || n.split(/[\s()]+/).some(w => w.startsWith(q)); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getDay(date, create){
  if (!S.days[date] && create){
    S.days[date] = { data:date, presentes:[], pag:{}, forma:{}, quadra:null, fila:[], jogos:[], custo:Number(S.config.custo)||0 };

const saveDay = date => save('days/' + date, S.days[date]);
const savePlayer = id => save('players/' + id, S.players[id] || null);
const playedDays = () => Object.values(S.days).filter(d => (d.presentes && d.presentes.length)).sort((a,b) => a.data < b.data ? -1 : 1);
const isGol = id => !!S.players[id]?.goleiro;
const linhaOf = d => (d?.presentes || []).filter(id => !isGol(id));
// rateio: custo da quadra ÷ jogadores de linha presentes, arredondado para o real de cima (goleiro não paga)
const valorCalc = d => { const n = linhaOf(d).length; return n ? Math.ceil((Number(d.custo)||0) / n) : 0; };
const valorDia = d => d.valor != null ? (Number(d.valor) || 0) : valorCalc(d);
const dueOf = (d, id) => isGol(id) ? 0 : (d.presentes || []).includes(id) ? valorDia(d) : 0;
// pagamento "true" = pagou o valor do dia (acompanha o valor quando ele é fechado depois)
const paidOf = (d, id) => { const v = (d.pag || {})[id]; return v === true ? dueOf(d, id) : (Number(v) || 0); };
const partsOf = d => [...new Set([...(d.presentes || []), ...Object.keys(d.pag || {})])];
const isPaid = (d, id) => paidOf(d,id) >= dueOf(d,id) - 0.009;
const formaOf = (d, id) => ((d.forma || {})[id]) || 'pix';
function fechamento(d){
  let pix = 0, balcao = 0;
  for (const id of partsOf(d)){ const v = paidOf(d,id); if (formaOf(d,id) === 'balcao') balcao += v; else pix += v; }
  const custo = Number(d.custo) || 0;
  const pixDono = Math.max(0, custo - balcao), excesso = Math.max(0, balcao - custo);
  return { pix, balcao, custo, pixDono, excesso };
}
// pendências: só dias que já passaram (o dia de hoje ainda está sendo cobrado)
function balances(){
  const b = {}, hoje = ymd(new Date());
  for (const d of playedDays().filter(x => x.data < hoje)) for (const id of partsOf(d)){
    const x = b[id] ||= {net:0, days:[]};
    const diff = dueOf(d,id) - paidOf(d,id); x.net += diff;
    if (diff > 0.009) x.days.push({date:d.data, due:diff});
  }
  return b;
}
function debts(){
  const m = {};
  for (const [id,x] of Object.entries(balances())) if (x.net > 0.009) m[id] = { total:x.net, days:x.days, credito: x.days.reduce((s,o)=>s+o.due,0) - x.net };
  return m;
}
function credits(){ return Object.entries(balances()).filter(([,x]) => x.net < -0.009).map(([id,x]) => [id, -x.net]); }
function faltando(){
  const ds = Object.keys(S.days).sort(); const ini = ds.length ? ds[0] : null; if (!ini) return [];
  const out = [], hoje = ymd(new Date()); const t = parseD(ini); while (t.getDay() !== GAMEDOW) t.setDate(t.getDate() + 1);
  for (; ymd(t) < hoje; t.setDate(t.getDate() + 7)){ const k = ymd(t), d = S.days[k];
    if (!d || (!(d.presentes||[]).length && !d.semJogo)) out.push(k); }
  return out;
}
function caixa(){
  let arrec = 0, quadra = 0, ent = 0, sai = 0;
  for (const d of playedDays()){ quadra += Number(d.custo)||0; for (const id of partsOf(d)) arrec += paidOf(d,id); }
  for (const l of Object.values(S.ledger)){ if (l.tipo === 'entrada') ent += Number(l.valor)||0; else sai += Number(l.valor)||0; }
  return { arrec, quadra, ent, sai, saldo: arrec - quadra + ent - sai };
}
function goalStats(days){
  const g = {}, a = {};
  for (const d of days) for (const j of (d.jogos||[])) for (const e of (j.ev||[])){
    if (e.g && e.g !== 'contra') g[e.g] = (g[e.g]||0) + 1;
    if (e.a) a[e.a] = (a[e.a]||0) + 1;
  }
  return { g, a };
}
function winsByPlayer(days){
  const w = {};
  for (const d of days) for (const j of (d.jogos||[])){
    if (j.r === 'e' || !j.q) continue;
    (j.q[j.r === 'a' ? 0 : 1] || []).forEach(id => w[id] = (w[id]||0) + 1);
  }
  return w;
}

/* ---------- rodízio da quinta ----------
   Ordem de chegada: 1º,3º,5º,7º,9º → Time 1 (azul); 2º,4º,6º,8º,10º → Time 2 (amarelo); o resto forma a fila (próximo, ré…).
   Perdeu: o time sai e entra no fim da fila, na ordem do time; os 5 primeiros da fila entram.
   Empate no 1º jogo (ou com os dois times novos): par ou ímpar decide quem fica.
   Empate depois: sai o time que venceu a partida anterior (fica quem acabou de entrar).
   3 vitórias seguidas: saem os dois (primeiro o perdedor, depois o vencedor, para o fim da fila). */
function previewTeams(d){
  const l = linhaOf(d).filter(id => !(d.saiu||{})[id]), f10 = l.slice(0,10);
  return { q:[f10.filter((_,i) => i%2 === 0), f10.filter((_,i) => i%2 === 1)], fila:l.slice(10) };
}
const take = d => d.fila.splice(0, 5);
function sideOf(d, id){ if (!d.quadra) return -1; return d.quadra[0].includes(id) ? 0 : d.quadra[1].includes(id) ? 1 : -1; }
// tira o jogador do rodízio; se estava em quadra, o primeiro da fila entra no lugar
function tirarDoRodizio(d, id){
  if (!d.quadra) return null;
  const fi = d.fila.indexOf(id); if (fi >= 0){ d.fila.splice(fi,1); return null; }
  const s = sideOf(d, id); if (s < 0) return null;
  const k = d.quadra[s].indexOf(id); const nx = d.fila.shift();
  if (nx) d.quadra[s][k] = nx; else d.quadra[s].splice(k,1);
  return nx || null;
}

let ac = null, wake = null;
function audio(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){} return ac; }
function tone(f, t0, d, vol = .5, type = 'square'){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), n = a.currentTime;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, n+t0); g.gain.exponentialRampToValueAtTime(vol, n+t0+.01);
  g.gain.setValueAtTime(vol, n+t0+d-.04); g.gain.exponentialRampToValueAtTime(0.0001, n+t0+d);
  o.connect(g).connect(a.destination); o.start(n+t0); o.stop(n+t0+d+.03);
}
function whistle(){
  for (let i=0;i<3;i++){ tone(2300, i*.75, .55, .55, 'square'); tone(2750, i*.75, .55, .25, 'sawtooth'); }
  try { navigator.vibrate && navigator.vibrate([600,200,600,200,900]); } catch(e){}
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}

const remaining = () => Math.max(0, dur() - elapsed());
const fclock = ms => { const s = Math.ceil(ms/1000); return `${Math.floor(s/60)}:${pad(s%60)}`; };
function endGame(){
  if (live.run){ live.acc = elapsed(); live.run = false; }
  live.done = true; saveLive(); whistle(); keepAwake(false);

function tick(){
  if (live.run){
    const r = remaining();
    if (!live.warned && r <= 60000 && dur() > 60000){ live.warned = true; saveLive(); shortBeep(); }
    if (r <= 0) endGame();
  }
  const c = document.getElementById('clock');
  if (c){ const r = live.done ? 0 : remaining(); c.textContent = fclock(r);
    c.className = 'clock' + (live.done ? ' end' : r <= 60000 ? ' warn' : ''); }
}

  const v = { dia:vDia, jogo:vJogo, caixa:vCaixa, relatorios:vRel, cadastro:vCad }[ui.tab];
  const banner = ui.mode === 'local' ? `<div class="banner">Sem conexão com o servidor. Verifique a internet.</div>` : '';
  $('#view').className = ui.tab === 'jogo' ? 'wide' : '';
  $('#view').innerHTML = banner + v();
  if ((ui.tab === 'dia' && ui.filtro) || (ui.tab === 'cadastro' && ui.filtroCad)) applyFiltro();
  tick();
}

/* ---------- LISTA (ordem de chegada) ---------- */
function posLabel(i){ // i = índice na lista de linha (0-based), antes do jogo começar
  if (i < 10) return `<span class="sm" style="color:${i%2===0?'#7fb0ff':COLETE[1].c};font-weight:700">${tname(i%2)}</span>`;
  if (i < 15) return '<span class="sm" style="color:var(--ac);font-weight:700">Próximo</span>';
  if (i < 20) return '<span class="sm mu" style="font-weight:700">Ré</span>';
  return '<span class="sm mu">Fila</span>';
}
function statusLabel(d, id){
  if ((d.saiu||{})[id]) return `<span class="sm" style="color:var(--warn);font-weight:700">saiu${d.saiu[id].j ? ' no jogo ' + d.saiu[id].j : ''}</span>`;
  const s = sideOf(d, id); if (s >= 0) return `<span class="sm" style="color:${s===0?'#7fb0ff':COLETE[1].c};font-weight:700">em quadra · ${tname(s)}</span>`;
  const k = d.fila.indexOf(id); if (k >= 0) return `<span class="sm ${k<5?'':'mu'}" style="${k<5?'color:var(--ac);':''}font-weight:700">${k < 5 ? 'próximo' : k < 10 ? 'ré' : 'fila'} · ${k+1}º</span>`;
  return '';
}
function vDia(){

      <button class="btn sm bad" data-a="pres" data-id="${id}" aria-label="Tirar da lista">×</button></div>`).join('');
  return `

  <div class="card">
    <h2>${fdate(ui.date)} <span class="sp sm mu" style="font-family:Inter;text-transform:none;font-weight:500">${!pres.length && !(d && d.semJogo) && ui.date < ymd(new Date()) ? '<button class="btn sm" data-a="semjogo">Não teve jogo</button>' : ''}</span></h2>

/* ---------- CAIXA ---------- */
function vCal(){
  const m = ui.calMes || ui.date.slice(0,7); const [y,mo] = m.split('-').map(Number);
  const firstD = new Date(y, mo-1, 1), dim = new Date(y, mo, 0).getDate(), hoje = ymd(new Date());
  const cells = []; for (let i = 0; i < firstD.getDay(); i++) cells.push('<span></span>');
  for (let dd = 1; dd <= dim; dd++){
    const k = `${y}-${pad(mo)}-${pad(dd)}`, dw = new Date(y, mo-1, dd).getDay(), dy = S.days[k];
    const temJogo = dy && dy.presentes && dy.presentes.length;
    const pend = temJogo && dy.presentes.some(id => !isPaid(dy,id));
    cells.push(`<button class="${dw===GAMEDOW?'ter':''} ${k===ui.date?'sel':''} ${k===hoje?'hoje':''}" data-a="pickday" data-d="${k}">${dd}${temJogo ? `<i class="dt ${pend?'pend':''}"></i>` : ''}</button>`);
  }
  return `<div class="card">
    <div class="calh"><button class="btn sm" data-a="calnav" data-n="-1">‹</button><b>${fmonth(m)}</b><button class="btn sm" data-a="calnav" data-n="1">›</button></div>
    <div class="cal">${['D','S','T','Q','Q','S','S'].map((w,i) => `<span class="wd ${i===GAMEDOW?'t':''}">${w}</span>`).join('')}${cells.join('')}</div>
    <p class="sm mu" style="margin-top:8px">Quintas em destaque. <span style="color:var(--ac)">●</span> dia com jogo · <span style="color:var(--warn)">●</span> com pagamento pendente.</p>
  </div>`;
}
function vValor(d){

/* ---------- RELATÓRIOS ---------- */
function monthData(m){
  const days = playedDays().filter(d => d.data.startsWith(m));
  const rows = {};
  for (const d of days) for (const id of partsOf(d)){
    const r = rows[id] ||= {pres:0, devido:0, pago:0};
    if ((d.presentes||[]).includes(id)) r.pres++; r.devido += dueOf(d,id); r.pago += paidOf(d,id);
  }
  const w = winsByPlayer(days), gs = goalStats(days);
  const led = Object.values(S.ledger).filter(l => (l.data||'').startsWith(m));
  const ent = led.filter(l => l.tipo==='entrada').reduce((s,l) => s + (Number(l.valor)||0), 0);
  const sai = led.filter(l => l.tipo!=='entrada').reduce((s,l) => s + (Number(l.valor)||0), 0);
  const quadra = days.reduce((s,d) => s + (Number(d.custo)||0), 0);
  const devido = Object.values(rows).reduce((s,r) => s + r.devido, 0);
  const pago = Object.values(rows).reduce((s,r) => s + r.pago, 0);
  const jogos = days.reduce((s,d) => s + (d.jogos||[]).length, 0);
  const fs = days.map(fechamento); const pix = fs.reduce((s,f) => s + f.pix, 0), balcao = fs.reduce((s,f) => s + f.balcao, 0), pixDono = fs.reduce((s,f) => s + f.pixDono, 0);
  return { days, rows, w, gs, ent, sai, quadra, devido, pago, jogos, led, pix, balcao, pixDono };
}

      ${rows.map(([id,r]) => { const ab = r.devido - r.pago; return `<tr><td>${esc(pname(id))}</td><td class="r">${r.pres}/${x.days.length}</td><td class="r">${x.w[id]||0}</td><td class="r">${x.gs.g[id]||0}</td><td class="r">${x.gs.a[id]||0}</td><td class="r">${brl(r.devido)}</td><td class="r">${brl(r.pago)}</td><td class="r ${ab>0.009?'neg':''}">${ab>0.009?brl(ab):'—'}</td></tr>`; }).join('')}

function relText(m){
  const x = monthData(m);
  const rows = Object.entries(x.rows).sort((a,b) => b[1].pres - a[1].pres);

  t += `Dias de jogo: ${x.days.length} · Jogos: ${x.jogos}\nRecebido: ${brl(x.pago)} (Pix ${brl(x.pix)} · Balcão ${brl(x.balcao)})\nEm aberto: ${brl(x.devido - x.pago)}\nQuadra: ${brl(x.quadra)} · Saídas: ${brl(x.sai)}${x.ent?` · Entradas: ${brl(x.ent)}`:''}\nResultado do mês: ${brl(x.pago - x.quadra + x.ent - x.sai)}\nSaldo em caixa: ${brl(caixa().saldo)}\n\n`;
  const art = Object.entries(x.gs.g).sort((a,b) => b[1]-a[1]).slice(0,5), asi = Object.entries(x.gs.a).sort((a,b) => b[1]-a[1]).slice(0,5);
  if (art.length) t += `⚽ *Artilharia*\n${art.map(([id,n],i) => `${i+1}. ${pname(id)} — ${n}`).join('\n')}\n\n`;
  if (asi.length) t += `🅰️ *Assistências*\n${asi.map(([id,n],i) => `${i+1}. ${pname(id)} — ${n}`).join('\n')}\n\n`;

  return t;
}

const A = {
  lgSend: async () => { const em = ($('#lgEmail').value || '').trim(); if (!em) return;
    const { error } = await sb.auth.signInWithOtp({ email: em, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
    if (error){ loginView(/not allowed|signups|not found|Signups/i.test(error.message) ? 'Esse e-mail não tem acesso ao app.' : 'Não foi possível enviar: ' + error.message); return; }
    ui.loginEmail = em; loginView(); setTimeout(() => $('#lgCode')?.focus(), 50); },
  lgVerify: async () => { const tk = ($('#lgCode').value || '').trim();
    const { error } = await sb.auth.verifyOtp({ email: ui.loginEmail, token: tk, type: 'email' });
    if (error){ loginView('Código inválido ou expirado. Tente de novo.'); return; }
    ui.loginEmail = null; startData(); },
  lgBack: () => { ui.loginEmail = null; loginView(); },
  logout: async () => { if (!(await ask('Sair do app neste aparelho?', 'Sair'))) return; await sb.auth.signOut(); localStorage.removeItem('futquinta_cache'); location.reload(); },
  tab: x => { ui.tab = x.k; location.hash = x.k; render(); window.scrollTo(0,0); },
  mclose: () => { closeModal(); if (askRes){ askRes(false); askRes = null; } },
  askyes: () => { const r = askRes; askRes = null; closeModal(); r && r(true); },
  askno:  () => { const r = askRes; askRes = null; closeModal(); r && r(false); },

  pres: async x => {
    const d = getDay(ui.date, true); const i = d.presentes.indexOf(x.id);
    if (i >= 0){
      const msg = paidOf(d, x.id) > 0 ? `${esc(pname(x.id))} já tem pagamento registrado. Tirar da lista e apagar o pagamento?` : `Tirar ${esc(pname(x.id))} da lista?`;
      if (!(await ask(msg, 'Tirar', true))) return;
      d.presentes.splice(i,1); delete d.pag[x.id]; if (d.forma) delete d.forma[x.id]; if (d.saiu) delete d.saiu[x.id];
      const nx = tirarDoRodizio(d, x.id); if (nx) toast(`${pname(nx)} entrou no lugar`);
    } else {
      if (!(await addChegada(d, x.id))) return;
      toast(`${pname(x.id)} — ${isGol(x.id) ? 'goleiro' : linhaOf(d).length + 'º da lista'}`);
    }
    saveDay(ui.date);
    if (ui.filtro){ ui.filtro = ''; render(); const f = $('#filtro'); if (f) f.focus(); } else render();
  },
  mv: x => { const d = S.days[ui.date]; if (!d || d.quadra) return;
    const l = linhaOf(d), i = l.indexOf(x.id), j = i + (+x.n); if (j < 0 || j >= l.length) return;
    const pi = d.presentes.indexOf(l[i]), pj = d.presentes.indexOf(l[j]);
    [d.presentes[pi], d.presentes[pj]] = [d.presentes[pj], d.presentes[pi]]; saveDay(ui.date); render(); },
  voltou: x => { const d = S.days[ui.date]; if (d.saiu) delete d.saiu[x.id]; if (d.quadra && !d.fila.includes(x.id) && sideOf(d,x.id) < 0) d.fila.push(x.id); saveDay(ui.date); render(); toast(`${pname(x.id)} voltou para o fim da fila`); },
  quickadd: async () => {
    const n = $('#quickAdd').value.trim(); if (!n) return;
    const gol = $('#quickTipo').value === 'G';
    const id = uid(); S.players[id] = { nome:n, ativo:true, criado:ymd(new Date()), ...(gol ? {goleiro:true} : {}) }; savePlayer(id);
    const d = getDay(ui.date, true); if (await addChegada(d, id)) saveDay(ui.date); render();
  },
  semjogo: () => { const d = getDay(ui.date, true); d.semJogo = !d.semJogo; saveDay(ui.date); render(); },

  start: () => { const d = S.days[ui.date]; const pv = previewTeams(d);
    d.quadra = pv.q; d.fila = pv.fila; d.novo = null; d.streak = null; d.jogos ||= [];
    live = {...LIVE0(), date:ui.date}; saveLive(); saveDay(ui.date); render(); window.scrollTo(0,0); },
  unstart: async () => { if (!(await ask('Desfazer os times e voltar a montar pela ordem de chegada?', 'Refazer'))) return;
    const d = S.days[ui.date]; d.quadra = null; d.fila = []; d.novo = null; d.streak = null; saveDay(ui.date); render(); },
  clock: () => {
    audio();
    if (live.run){ live.acc = elapsed(); live.run = false; keepAwake(false); }
    else { live.start = Date.now(); live.run = true; live.date = ui.date; keepAwake(true); }
    saveLive(); render();
  },
  reset: async () => { ui.pickRes = false; if ((live.acc > 0 || live.run || live.g[0] || live.g[1]) && !(await ask('Zerar cronômetro e placar?', 'Zerar'))) return;
    live = {...LIVE0(), date:ui.date}; saveLive(); keepAwake(false); render(); },
  gol: x => {
    audio(); const k = +x.k; live.ev ||= [];
    if (+x.d < 0){
      if (live.g[k] <= 0) return;
      live.g[k]--; for (let i = live.ev.length - 1; i >= 0; i--) if (live.ev[i].s === k){ live.ev.splice(i,1); break; }
      saveLive(); render(); return;
    }
    live.g[k]++; live.ev.push({s:k}); saveLive(); render();
    goalModal(live.ev.length - 1, 'g');
  },
  gedit: x => goalModal(+x.i, 'g'),
  gsc: x => { const e = live.ev[+x.i]; if (!e) return; e.g = x.p || null; if (e.a === e.g) e.a = null; saveLive(); render();
    if (x.p && x.p !== 'contra') goalModal(+x.i, 'a'); else closeModal(); },
  gas: x => { const e = live.ev[+x.i]; if (!e) return; e.a = x.p || null; saveLive(); closeModal(); render(); },
  pickres: () => { ui.pickRes = true; render(); },
  res: async x => {
    ui.pickRes = false;
    const d = S.days[ui.date]; if (!d || !d.quadra) return;
    if (!live.done && !live.run && live.acc === 0 && !(await ask('O cronômetro não foi usado. Registrar o resultado mesmo assim?', 'Registrar'))) return;
    if (live.run){ live.acc = elapsed(); live.run = false; }
    let fica = null;
    if (x.r === 'e'){
      if (x.fica !== undefined && x.fica !== '') fica = +x.fica;
      else if (d.novo === 0 || d.novo === 1) fica = d.novo;          // fica quem acabou de entrar
      else { empateModal(); return; }                                 // 1º jogo / dois times novos: par ou ímpar
    }
    const snap = { quadra:clone(d.quadra), fila:[...d.fila], streak:d.streak || null, novo:d.novo ?? null, meio:[...(d.meio||[])] };
    // sai da quadra: vai para o fim da fila, menos quem entrou no meio do jogo (volta para o início)
    const meio = new Set(d.meio || []);
    const sair = (...ts) => { const ini = [], fim = []; ts.flat().forEach(id => (meio.has(id) ? ini : fim).push(id)); d.fila = [...ini, ...d.fila, ...fim]; };
    d.jogos.push({ q:clone(d.quadra), ga:live.g[0], gb:live.g[1], r:x.r, dur:Math.min(elapsed(), dur()), h:Date.now(),
      ev:(live.ev||[]).map(e => ({s:e.s, g:e.g||null, a:e.a||null})), snap });
    let msg;
    if (x.r === 'e'){
      const sai = 1 - fica;
      sair(d.quadra[sai]); d.quadra[sai] = take(d); d.novo = sai; d.streak = null;
      msg = `Empate — sai o ${tname(sai)}, fica o ${tname(fica)}`;
    } else {
      const W = x.r === 'a' ? 0 : 1, L = 1 - W;
      const n = (d.streak && d.streak.s === W ? d.streak.n : 0) + 1;
      if (n >= 3){
        sair(d.quadra[L], d.quadra[W]); d.quadra = [take(d), take(d)]; d.novo = null; d.streak = null;
        msg = `${tname(W)} venceu 3 seguidas — saem os dois times`;
      } else {
        sair(d.quadra[L]); d.quadra[L] = take(d); d.novo = L; d.streak = { s:W, n };
        msg = `${tname(L)} perdeu e foi para o fim da fila`;
      }
    }
    d.meio = []; closeModal();
    live = {...LIVE0(), date:ui.date}; saveLive(); keepAwake(false);
    saveDay(ui.date); render(); window.scrollTo(0,0); toast(msg);
  },
  undo: async () => { const d = S.days[ui.date]; if (!(await ask('Desfazer o último jogo registrado? Os times e a fila voltam como estavam.', 'Desfazer'))) return;
    const j = d.jogos.pop(); if (j && j.snap){ d.quadra = j.snap.quadra; d.fila = j.snap.fila; d.streak = j.snap.streak; d.novo = j.snap.novo; d.meio = j.snap.meio || []; }
    saveDay(ui.date); render(); },
  slot: x => slotModal(S.days[ui.date], x.id),
  saiu: x => A.saiuq(x),
  // saiu durante o jogo: escolhe quem entra (1º da fila, outro da fila ou seguir com 4)
  saiuq: async x => { const d = S.days[ui.date], s = sideOf(d, x.id);
    if (s < 0){ (d.saiu ||= {})[x.id] = { j: d.jogos.length + 1 }; tirarDoRodizio(d, x.id); saveDay(ui.date); closeModal(); render(); toast(`${pname(x.id)} saiu do rodízio`); return; }
    const nx = d.fila[0];
    if (!(await ask(`<b>${esc(pname(x.id))}</b> saiu do jogo?<br><span class="sm mu">${nx ? `Entra o 1º da fila: <b>${esc(pname(nx))}</b>.` : `A fila está vazia — o ${esc(tname(s))} segue com ${d.quadra[s].length - 1}.`} Quem saiu continua na conta do rateio.</span>`, 'Confirmar saída'))) return;
    A.saiuok({ id:x.id, s:nx || '' }); },
  saiuok: x => { const d = S.days[ui.date], s = sideOf(d, x.id); if (s < 0) return;
    (d.saiu ||= {})[x.id] = { j: d.jogos.length + 1 };
    const i = d.quadra[s].indexOf(x.id);
    if (x.s){ d.fila.splice(d.fila.indexOf(x.s), 1); d.quadra[s][i] = x.s; (d.meio ||= []).push(x.s); }
    else d.quadra[s].splice(i, 1);
    saveDay(ui.date); closeModal(); render(); toast(x.s ? `${pname(x.s)} entrou no lugar de ${pname(x.id)}` : `${tname(s)} segue com ${d.quadra[s].length}`); },
  compq: x => { const d = S.days[ui.date]; if (d.fila.length) A.compok({ k:x.k, s:d.fila[0] }); },
  compok: x => { const d = S.days[ui.date], k = +x.k; d.fila.splice(d.fila.indexOf(x.s), 1); d.quadra[k].push(x.s); (d.meio ||= []).push(x.s);
    saveDay(ui.date); closeModal(); render(); toast(`${pname(x.s)} entrou no ${tname(k)}`); },
  trocaf: x => { const d = S.days[ui.date], s = sideOf(d, x.id), k = +x.k; if (s < 0) return;
    const i = d.quadra[s].indexOf(x.id), o = d.fila[k]; d.quadra[s][i] = o; d.fila[k] = x.id;
    saveDay(ui.date); closeModal(); render(); },
  editf: () => filaModal(),
  fmv: x => { const d = S.days[ui.date], k = +x.k, j = k + (+x.n); if (j < 0 || j >= d.fila.length) return;
    [d.fila[k], d.fila[j]] = [d.fila[j], d.fila[k]]; saveDay(ui.date); render(); filaModal(); },

  pickday: x => { ui.date = x.d; ui.calMes = x.d.slice(0,7); render(); },
  calnav: x => { const m = ui.calMes || ui.date.slice(0,7); const [y,mo] = m.split('-').map(Number); const dt = new Date(y, mo-1 + (+x.n), 1); ui.calMes = ymd(dt).slice(0,7); render(); },
  valorfix: () => { const d = S.days[ui.date]; d.valor = valorCalc(d); saveDay(ui.date); render(); toast('Valor do dia fechado em ' + brl(d.valor)); },
  valoropen: () => { const d = S.days[ui.date]; delete d.valor; saveDay(ui.date); render(); },
  pay: x => { const d = getDay(ui.date, true); d.pag[x.id] = true; (d.forma ||= {})[x.id] = x.f; saveDay(ui.date); render(); },
  unpay: x => { const d = getDay(ui.date, true); delete d.pag[x.id]; if (d.forma) delete d.forma[x.id]; saveDay(ui.date); render(); },
  copydono: () => { const fc = fechamento(S.days[ui.date]); copyText(fc.pixDono.toFixed(2).replace('.', ',')); },
  donopago: () => { const d = S.days[ui.date]; d.donoPago = !d.donoPago; saveDay(ui.date); render(); },
  quitar: x => modal(`<h3>Quitar ${esc(pname(x.id))}</h3><p class="sm mu">${x.d ? fdate(x.d) : 'Todas as pendências'} — como pagou?</p>
    <div class="grid2"><button class="btn pri" data-a="quitarok" data-id="${x.id}" data-d="${x.d||''}" data-f="pix">Pix</button><button class="btn" style="background:#6b4a12;border-color:#6b4a12" data-a="quitarok" data-id="${x.id}" data-d="${x.d||''}" data-f="balcao">Balcão</button></div>
    <button class="btn" data-a="mclose">Cancelar</button>`),
  quitartudo: x => A.quitar({id:x.id, d:''}),
  quitarok: x => {
    const dates = x.d ? [x.d] : (debts()[x.id]?.days || []).map(o => o.date);
    dates.forEach(dt => { const d = S.days[dt]; d.pag[x.id] = true; (d.forma ||= {})[x.id] = x.f; saveDay(dt); });
    closeModal(); render(); toast(x.f === 'balcao' ? 'Pago no balcão — confira o pix ao dono desse dia' : 'Pagamento registrado'); },
  copycob: () => {
    const dd = Object.entries(debts()).sort((a,b) => b[1].total - a[1].total);
    let t = `⚽ *FUT QUINTA — pendências*\n\n`;
    dd.forEach(([id,v]) => t += `• ${pname(id)}: ${brl(v.total)} (${v.days.map(o => fdate(o.date).split(' ')[1]).join(', ')})\n`);
    t += `\nTotal em aberto: ${brl(dd.reduce((s,[,v]) => s + v.total, 0))}`; copyText(t);
  },
  addlg: () => {
    const v = parseFloat(String($('#lgVal').value).replace(',', '.')); const desc = $('#lgDesc').value.trim();
    if (!(v > 0) || !desc){ toast('Preencha descrição e valor'); return; }
    const id = 'l' + Date.now().toString(36);
    S.ledger[id] = { tipo:$('#lgTipo').value, data:$('#lgData').value || ymd(new Date()), desc, valor:v };
    save('ledger/' + id, S.ledger[id]); render();
  },
  dellg: async x => { if (!(await ask('Excluir este lançamento?', 'Excluir', true))) return; delete S.ledger[x.id]; save('ledger/' + x.id, null); render(); },
  goday: x => { ui.date = x.d; A.tab({k:'dia'}); },
  copyrel: () => copyText(relText(ui.mes)),

  addmode: x => { ui.addMode = x.m; render(); setTimeout(() => (x.m === 'lote' ? $('#bulk') : $('#newName'))?.focus(), 30); },
  addp: () => { const n = $('#newName').value.trim(); if (!n) return; const id = uid(); const gol = $('#newTipo').value === 'G';
    S.players[id] = { nome:n, ativo:true, criado:ymd(new Date()), ...(gol ? {goleiro:true} : {}) }; savePlayer(id); render(); setTimeout(() => $('#newName')?.focus(), 30); },
  pedit: x => { const p = S.players[x.id];
    modal(`<h3>Editar jogador</h3><label class="f">Nome<input id="edName" value="${esc(p.nome)}"></label>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="edAt" style="width:auto" ${p.ativo!==false?'checked':''}> Ativo (aparece na lista de chegada)</label>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="edGol" style="width:auto" ${p.goleiro?'checked':''}> Goleiro (não paga e não entra no rodízio)</label>
      <div class="btns" style="justify-content:space-between"><button class="btn bad" data-a="pdel" data-id="${x.id}">Excluir</button><span class="btns"><button class="btn" data-a="mclose">Cancelar</button><button class="btn pri" data-a="psave" data-id="${x.id}">Salvar</button></span></div>`); },
  psave: x => { const p = S.players[x.id]; const n = $('#edName').value.trim(); if (n) p.nome = n;
    p.ativo = $('#edAt').checked; p.goleiro = $('#edGol').checked; savePlayer(x.id); closeModal(); render(); },
  pdel: async x => {
    const used = Object.values(S.days).some(d => (d.presentes||[]).includes(x.id));
    if (used){ S.players[x.id].ativo = false; savePlayer(x.id); closeModal(); render(); toast('Tem histórico — foi desativado em vez de excluído'); return; }
    closeModal(); if (!(await ask(`Excluir ${esc(pname(x.id))}?`, 'Excluir', true))) return;
    delete S.players[x.id]; save('players/' + x.id, null); render();
  },
  bulk: () => {
    const lines = $('#bulk').value.split('\n').map(s => s.trim()).filter(Boolean); let k = 0;
    lines.forEach(l => { const [n, p] = l.split(/[;,\t]/).map(s => s.trim()); if (!n) return;
      const gol = /^g/i.test(p || '');
      const id = uid() + k++; S.players[id] = { nome:n, ativo:true, criado:ymd(new Date()), ...(gol ? {goleiro:true} : {}) }; savePlayer(id); });
    toast(`${k} jogador(es) adicionados`); render();
  },
  fromterca: async () => {
    modal('<p>Buscando o cadastro da terça…</p>');
    try { ui.tercaList = await tercaPlayers(); ui.tercaSel = new Set(); ui.tq = ''; tercaModal(); }
    catch(e){ closeModal(); toast('Não foi possível ler o cadastro da terça'); }
  },
  tsel: x => { const s = ui.tercaSel; if (s.has(x.id)) s.delete(x.id); else s.add(x.id); tercaModal(); },
  tok: () => { let k = 0;
    for (const p of ui.tercaList || []) if (ui.tercaSel.has(p.id) && !S.players[p.id]){
      S.players[p.id] = { nome:p.nome, ativo:true, criado:ymd(new Date()), ...(p.goleiro ? {goleiro:true} : {}) }; savePlayer(p.id); k++; }
    closeModal(); render(); toast(`${k} jogador(es) trazidos da terça`); },
  savecfg: () => {
    const num = (id, def) => { const v = parseFloat(String($(id).value).replace(',', '.')); return isFinite(v) && v >= 0 ? v : def; };
    S.config = { ...S.config, custo:num('#cfC',270), minutos:Math.max(1,num('#cfM',8)), max:Math.max(2,num('#cfX',20)) };
    save('fut/config', S.config); toast('Ajustes salvos'); render();
  },
  backup: () => copyText(JSON.stringify({ v:1, app:'quinta', config:S.config, players:S.players, days:S.days, ledger:S.ledger })),
  import: () => modal(`<h3>Restaurar backup</h3><p class="sm mu">Cole o texto do backup. Registros com o mesmo identificador serão substituídos.</p><textarea id="impTx" rows="10"></textarea><div class="btns" style="justify-content:flex-end"><button class="btn" data-a="mclose">Cancelar</button><button class="btn pri" data-a="doimport">Restaurar</button></div>`),
  doimport: () => {
    let o; try { o = JSON.parse($('#impTx').value); } catch(e){ toast('Texto inválido'); return; }
    if (o.config){ S.config = {...DEF, ...o.config}; save('fut/config', S.config); }
    for (const k of ['players','days','ledger']) Object.entries(o[k] || {}).forEach(([id,v]) => { S[k][id] = v; save(k + '/' + id, v); });
    closeModal(); toast('Backup restaurado'); render();
  }
};
const C = {
  daycost: el => { const d = S.days[ui.date]; d.custo = parseFloat(el.value) || 0; saveDay(ui.date); render(); },
  mes: el => { if (el.value){ ui.mes = el.value; render(); } }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; const f = A[b.dataset.a]; if (f){ e.preventDefault(); f(b.dataset, b); } });
document.addEventListener('input', e => {
  if (e.target.id === 'tq'){ ui.tq = e.target.value; filtraTerca(); return; }
  if (e.target.id === 'filtroCad'){ ui.filtroCad = e.target.value; applyFiltro(); return; }
  if (e.target.id !== 'filtro') return;
  ui.filtro = e.target.value;
  applyFiltro();
});
function applyFiltro(){
  const q = ui.tab === 'cadastro' ? ui.filtroCad : ui.filtro;
  document.querySelectorAll('#view .prow[data-nm]').forEach(r => { r.hidden = !matchNm(r.dataset.nm, q); });
  document.querySelectorAll('#view .plist').forEach(l => { if (!l.querySelector('.prow[data-nm]')) return;
    const vis = l.querySelector('.prow[data-nm]:not([hidden])'); const sec = l.previousElementSibling;
    if (sec && sec.classList.contains('sect')) sec.hidden = !vis; l.hidden = !vis; });
}
document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && C[el.dataset.c]) C[el.dataset.c](el); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'newName') A.addp(); else if (e.target.id === 'quickAdd') A.quickadd();
});
$('#dateIn').addEventListener('change', e => { if (e.target.value){ ui.date = e.target.value; ui.calMes = null; render(); } });
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (k !== ui.tab && TABS.some(t => t[0] === k)){ ui.tab = k; render(); } });

render();
init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
